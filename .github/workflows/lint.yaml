name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: lint post-service
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: post-service
      - name: lint notification-service
        uses: golangci/golangci-lint-action@v9
        with:
            version: v2.11
            working-directory: notification-service
