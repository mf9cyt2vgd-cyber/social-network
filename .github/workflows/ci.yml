name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' 

      - name: Create .env files
        run: |
          # Создаем контент файла (используем одинаковые данные для всех сервисов)
          ENV_CONTENT="POSTGRES_USER=ivan
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=postgres
          DB_HOST=postgres
          DB_PORT=5432
          DATABASE_URL=postgres://ivan:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/postgres?sslmode=disable"
          
          # Записываем контент в файлы каждого сервиса
          echo "$ENV_CONTENT" > ./post-service/.env
          echo "$ENV_CONTENT" > ./notification-service/.env

      - name: Build and Smoke Test
        run: |

          docker compose build
          
          docker compose up -d
          
          sleep 10
          
          if [ $(docker compose ps --format json | jq '.[] | select(.State == "exited")' | wc -l) -ne 0 ]; then
            echo "Один из контейнеров упал после запуска!"
            docker compose logs
            exit 1
          fi
          
          echo "Все сервисы успешно запустились!"
          
          docker compose down
