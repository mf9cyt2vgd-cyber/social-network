name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' 

      - name: Build Docker Compose
        run: docker compose build

      - name: Run Tests in Docker Compose
      
        run: docker compose up --abort-on-container-exit --exit-code-from notification-service
